services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: module4-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP REST API + web dashboard
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # Qdrant ships without curl/wget in the image; use the bundled entrypoint
      # binary to hit the readiness endpoint over TCP.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant_storage:
    name: module4_qdrant_storage
