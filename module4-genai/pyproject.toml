[project]
name = "module4-genai"
version = "0.1.0"
description = "Modulo 4 — Vector Databases, RAG, Agents & MCP (Advanced ML Engineering)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # Datos y numerica
    "pandas>=2.0",
    "numpy>=1.26",
    # Base de datos vectorial
    "qdrant-client>=1.12.0",
    # Embeddings multimodales (gemini-embedding-2 via API de Gemini)
    "google-genai>=1.16.0",
    # LLM de generacion: Ollama cloud (kimi-k3)
    "ollama>=0.5.0",
    "langchain-ollama>=0.3.0",
    # Recuperacion lexica / sparse para busqueda hibrida
    "rank-bm25>=0.2.2",
    # LangChain + LangGraph para agentes
    "langchain>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.2.0",
    # Puente MCP -> herramientas LangChain (notebook 03)
    "langchain-mcp-adapters>=0.1.0",
    # Widgets interactivos e imagenes en los notebooks
    "ipywidgets>=8.1.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    # App del agente (notebook 02, carpeta app/)
    "streamlit>=1.40",
    # Config / env
    "python-dotenv>=1.0.0",
    # SDK del Model Context Protocol
    "mcp>=1.2.0",
    # Herramientas de notebook
    "jupyterlab>=4.0",
    "nbformat>=5.10",
]

[tool.uv]
# Proyecto gestionado con uv. Instalacion:  uv sync
# Ejecutar Jupyter:                          uv run jupyter lab
package = false
