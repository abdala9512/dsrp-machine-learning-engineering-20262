[project]
name = "module3-time-series"
version = "0.1.0"
description = "Modulo 3 — Series de Tiempo (+ MLflow) (Advanced ML Engineering)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # Datos y ML
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    # Modelos estadisticos: descomposicion, STL, suavizamiento exponencial,
    # SARIMA (notebooks 1 y 2)
    "statsmodels>=0.14",
    # Pronostico con ML y ensambles (notebooks 4 y 5)
    "xgboost>=2.0",
    # Clustering DTW (notebook 6)
    "tslearn>=0.6",
    # numba moderno: evita que el resolutor caiga a un llvmlite antiguo
    # (sin soporte para Python 3.12) al resolver tslearn -> numba
    "numba>=0.60",
    # Experiment tracking & model registry (MLflow 3.x) — como en el Modulo 2
    "mlflow>=3.1",
    "psycopg2-binary>=2.9",
    # Backend cloud de tracking: dagshub.init(..., mlflow=True)
    "dagshub>=0.3",
    # Herramientas de notebook
    "jupyterlab>=4.0",
    "nbformat>=5.9",
    "seaborn>=0.13.2",
]

# Opcional (auto_arima, notebook 2). Se instala aparte porque su resolucion
# puede forzar downgrades de numpy:  uv pip install pmdarima
# [pmdarima>=2.0]

[tool.uv]
# Proyecto gestionado con uv. Instalacion:  uv sync
# Ejecutar Jupyter:                          uv run jupyter lab
package = false
